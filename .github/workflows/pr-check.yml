name: PR validation

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Linter
        run: pnpm lint

      - name: Types
        run: pnpm lint:types

      - name: Unit tests
        run: pnpm test

      - name: Security
        run: pnpm audit --audit-level high

  # Inlined from 1inch/workflows trivy-scan-v1 (v1.0.8). This repo is public and
  # GitHub cannot resolve that private reusable workflow here, which fails the
  # entire PR validation run at startup (0 jobs) — including the check job.
  # Same fix as limit-order-sdk and solana-fusion-sdk pr-check.yml.
  dependabot-audit:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy scan (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          skip-files: .npmrc
          timeout: 10m0s
          limit-severities-for-sarif: false
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Fail on vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          skip-files: .npmrc
          timeout: 10m0s
          format: table
          exit-code: '1'
          skip-setup-trivy: true
