name: PR validation

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Linter
        run: pnpm lint

      - name: Types
        run: pnpm lint:types

      - name: Unit tests
        run: pnpm test

      - name: Security
        run: pnpm audit --audit-level high

  dependabot-audit:
    uses: 1inch/workflows/.github/workflows/trivy-scan.yaml@trivy-scan-v1
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    with:
      severity: 'CRITICAL'
      limit-severities-for-sarif: false
      skip-files: '.npmrc'
